<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — eDiwa Library</title>
<style>
     * { box-sizing: border-box; }
     body {
     margin: 0;
     font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
     background: #F8F9F8;
     display: flex;
     align-items: center;
     justify-content: center;
     min-height: 100vh;
     padding: 20px;
     }
     .card {
     background: #fff;
     border-radius: 20px;
     padding: 32px 28px;
     max-width: 400px;
     width: 100%;
     box-shadow: 0 2px 12px rgba(0,0,0,0.08);
     }
     h1 {
     font-size: 20px;
     font-weight: 800;
     color: #1B1B1B;
     margin: 0 0 4px;
     }
     p.sub {
     font-size: 13px;
     color: #666;
     margin: 0 0 24px;
     }
     label {
     display: block;
     font-size: 11px;
     font-weight: 600;
     color: #666;
     text-transform: uppercase;
     letter-spacing: 0.5px;
     margin-bottom: 8px;
     }
     input {
     width: 100%;
     padding: 12px 14px;
     border: 1.5px solid #E0E0E0;
     border-radius: 10px;
     font-size: 15px;
     margin-bottom: 18px;
     }
     input:focus { outline: none; border-color: #1B5E20; }
     button {
     width: 100%;
     background: #1B5E20;
     color: #fff;
     border: none;
     padding: 14px;
     border-radius: 12px;
     font-size: 15px;
     font-weight: 700;
     letter-spacing: 0.5px;
     cursor: pointer;
     }
     button:disabled { opacity: 0.6; cursor: default; }
     .message {
     margin-top: 16px;
     font-size: 13px;
     padding: 12px 14px;
     border-radius: 10px;
     display: none;
     }
     .message.success { background: #E8F5E9; color: #1B5E20; display: block; }
     .message.error { background: #FEF2F2; color: #B91C1C; display: block; }
     .hint { font-size: 11px; color: #999; margin-top: -12px; margin-bottom: 18px; }
</style>
</head>
<body>
     <div class="card">
     <h1>Reset your password</h1>
     <p class="sub">Enter a new password for your eDiwa Library account.</p>

     <form id="resetForm">
          <label for="new_password">New Password</label>
          <input type="password" id="new_password" required minlength="8" placeholder="At least 8 characters" />
          <p class="hint">Must be at least 8 characters.</p>

          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" required minlength="8" placeholder="Re-enter your new password" />

          <button type="submit" id="submitBtn">Reset Password</button>
     </form>

     <div id="messageBox" class="message"></div>
     </div>

     <script>
     // API_BASE is deliberately the same origin this page was served
     // from — the backend serves this file itself, so there's no separate
     // URL to configure or get out of sync with the mobile app's API_URL.
     const API_BASE = window.location.origin;

     const params = new URLSearchParams(window.location.search);
     const token = params.get('token');

     const form = document.getElementById('resetForm');
     const messageBox = document.getElementById('messageBox');
     const submitBtn = document.getElementById('submitBtn');

     function showMessage(text, type) {
          messageBox.textContent = text;
          messageBox.className = 'message ' + type;
     }

     if (!token) {
          form.style.display = 'none';
          showMessage('This reset link is missing its token. Please request a new one from the app.', 'error');
     }

     form.addEventListener('submit', async (e) => {
          e.preventDefault();

          const newPassword = document.getElementById('new_password').value;
          const confirmPassword = document.getElementById('confirm_password').value;

          if (newPassword !== confirmPassword) {
          showMessage('Passwords do not match.', 'error');
          return;
          }
          if (newPassword.length < 8) {
          showMessage('Password must be at least 8 characters.', 'error');
          return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = 'Resetting...';

          try {
          const res = await fetch(`${API_BASE}/api/student/reset-password`, {
               method: 'POST',
               headers: { 'Content-Type': 'application/json' },
               body: JSON.stringify({ token, new_password: newPassword }),
          });
          const data = await res.json();

          if (res.ok) {
               form.style.display = 'none';
               showMessage(data.message || 'Password reset successfully. You can now log in with your new password.', 'success');
          } else {
               showMessage(data.message || 'Something went wrong. Please try again.', 'error');
               submitBtn.disabled = false;
               submitBtn.textContent = 'Reset Password';
          }
          } catch (err) {
          showMessage('Could not reach the server. Check your connection and try again.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Reset Password';
          }
     });
     </script>
</body>
</html>
